<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - WaVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barra de Navegación -->
  <nav class="navbar">
    <div class="logo">WaVault</div>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="beats.html">Beats</a></li>
      <li><a href="registro.html">Registro</a></li>
      <li><a href="login.html">Iniciar Sesión</a></li>
    </ul>
  </nav>

  <!-- Formulario de Registro -->
  <div class="form-container">
    <h2>Registro</h2>
    <form id="registro-form">
      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
      </div>
      <div class="form-group">
        <button type="submit" class="btn">Registrar</button>
      </div>
      <p class="redirect-text">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 WaVault. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
